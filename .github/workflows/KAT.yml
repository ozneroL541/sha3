name: Known Answer Tests (KAT) for SHA-3

on:
    push:
        branches: [ "master", "dev" ]
    pull_request:
        branches: [ "master", "dev" ]

jobs:
    kat:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download KATs
              run: make download-kats

            - name: Run KAT Tests
              run: make test
